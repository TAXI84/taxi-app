<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;border-bottom:1px solid #334155;margin-bottom:16px}.header h1{color:#38bdf8;font-size:20px}
.badge{background:#1e293b;padding:6px 12px;border-radius:20px;font-size:12px}
.nav-tabs{display:flex;margin:12px 0 20px;border-bottom:1px solid #334155}.nav-tabs button{flex:1;padding:12px 4px;background:none;border:none;color:#94a3b8;font-size:11px;font-weight:600;border-bottom:2px solid transparent;cursor:pointer}.nav-tabs button.active{color:#38bdf8;border-bottom-color:#38bdf8}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}.stat-card{background:#1e293b;padding:14px 10px;border-radius:12px;text-align:center}.stat-number{font-size:22px;font-weight:800;color:#38bdf8}.stat-number.green{color:#4ade80}.stat-label{font-size:11px;color:#94a3b8;margin-top:4px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.row-btns{display:flex;gap:8px;margin:10px 0;align-items:center}.row-btns .btn{flex:1;margin:0;font-size:13px;padding:12px 6px}

.input-group input[type=range]{width:100%}
.hidden{display:none!important}.hint{color:#64748b;font-size:12px}h2{font-size:18px;margin-bottom:12px}.section-title{color:#94a3b8;font-size:13px;margin:14px 0 8px;text-transform:uppercase}
.info-box{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:12px;border-radius:10px;margin:12px 0;font-size:13px}

.fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;background:#0ea5e9;border:none;border-radius:30px;font-size:30px;color:#fff;z-index:50}

.scan-stage{position:relative;width:100%;margin:12px 0;background:#0f172a;border-radius:12px;overflow:hidden;touch-action:none}

.crop-svg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5}
.crop-svg polygon{fill:rgba(14,165,233,.12);stroke:#38bdf8;stroke-width:2;stroke-linejoin:round}
.crop-svg circle{fill:#38bdf8;stroke:#fff;stroke-width:2;cursor:grab}
