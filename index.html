<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TaxiCPAM Copilote</title>
<!-- OCR 100% Local dans le navigateur (Zéro fuite RGPD) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;border-bottom:1px solid #334155;margin-bottom:16px}
.header h1{color:#38bdf8;font-size:20px}
.badge{background:#1e293b;padding:6px 12px;border-radius:20px;font-size:12px}
.nav-tabs{display:flex;margin:12px 0 20px;border-bottom:1px solid #334155}
.nav-tabs button{flex:1;padding:12px 6px;background:none;border:none;color:#94a3b8;font-size:12px;font-weight:600;border-bottom:2px solid transparent;cursor:pointer}
.nav-tabs button.active{color:#38bdf8;border-bottom-color:#38bdf8}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.stat-card{background:#1e293b;padding:14px 10px;border-radius:12px;text-align:center}
.stat-number{font-size:22px;font-weight:800;color:#38bdf8}
.stat-number.green{color:#4ade80}
.stat-label{font-size:11px;color:#94a3b8;margin-top:4px}
.btn{background:#0ea5e9;color:#fff;border:none;padding:16px 0;border-radius:14px;font-size:16px;font-weight:700;width:100%;cursor:pointer;margin:10px 0;min-height:52px}
.btn-secondary{background:#334155}
.card{background:#1e293b;padding:14px;border-radius:12px;margin-bottom:10px}
.input-group{margin-bottom:14px}
.input-group label{display:block;color:#94a3b8;font-size:13px;margin-bottom:6px}
.input-group input{width:100%;padding:14px 12px;background:#1e293b;border:1px solid #334155;border-radius:12px;color:#f8fafc;font-size:16px;min-height:48px}
.radio-group{display:flex;gap:8px;flex-wrap:wrap}
.radio-group button{padding:12px 16px;background:#1e293b;border:none;border-radius:12px;color:#f8fafc;font-weight:700;font-size:15px;cursor:pointer;min-height:48px;flex:1}
.radio-group button.active{background:#0ea5e9}
.hidden{display:none!important}
.back-btn{background:none;border:none;color:#38bdf8;font-size:15px;cursor:pointer;margin-bottom:12px;padding:8px 0}
.error-box{background:#7f1d1d;border:1px solid #f87171;color:#fca5a5;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}
.mistral-box{background:#1e1b4b;border:1px solid #7c3aed;color:#ddd6fe;padding:14px;border-radius:12px;margin:14px 0;font-size:14px}

/* BOUTON MIC FLOTTANT À DROITE */
.voice-fab{position:fixed;bottom:24px;right:24px;width:64px;height:64px;background:#7c3aed;border:none;border-radius:50%;font-size:28px;color:#fff;box-shadow:0 4px 20px rgba(124,58,237,.5);cursor:pointer;z-index:99;display:flex;align-items:center;justify-content:center;transition:all .2s}
.voice-fab.active{background:#ef4444;animation:pulse 1.2s infinite;box-shadow:0 0 25px rgba(239,68,68,.8)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* MODULE SCAN */
.scan-zone{background:#1e293b;border:2px dashed #0ea5e9;border-radius:16px;padding:16px;text-align:center;margin-bottom:16px;cursor:pointer}
.scan-zone h3{color:#38bdf8;font-size:15px;margin-bottom:4px}
.scan-zone p{color:#94a3b8;font-size:12px}
.cat-selector{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-top:10px;margin-bottom:16px;}
.cat-btn{background:#0f172a;border:1px solid #334155;color:#94a3b8;padding:8px 12px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}
.cat-btn.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
</style>
</head>
<body>

<div class="header">
  <h1>🚕 TaxiCPAM</h1>
  <span class="badge" id="api-badge">...</span>
</div>

<!-- BOUTON VOCAL UNIQUE À DROITE -->
<button class="voice-fab" id="mic-btn" onclick="toggleVoiceMaster()" title="Activer / Désactiver le micro">🎙️</button>

<div class="nav-tabs" id="main-nav">
  <button class="active" data-tab="dashboard" onclick="showTab('dashboard')">Accueil</button>
  <button data-tab="history" onclick="showTab('history')">Historique</button>
</div>

<!-- ACCUEIL -->
<div id="tab-dashboard">
  <div class="stats">
    <div class="stat-card"><div class="stat-number" id="stats-courses">0</div><div class="stat-label">Courses</div></div>
    <div class="stat-card"><div class="stat-number green" id="stats-ca">0 €</div><div class="stat-label">CA</div></div>
    <div class="stat-card"><div class="stat-number" id="stats-avg">0 €</div><div class="stat-label">Moyenne</div></div>
  </div>
  <button class="btn" onclick="showTab('new')">+ NOUVELLE COURSE</button>
  <div style="color:#94a3b8;font-size:13px;margin:16px 0 8px;text-transform:uppercase">Dernières courses</div>
  <div id="recent-list"></div>
</div>

<!-- NOUVELLE COURSE (INCLUT LE SCAN) -->
<div id="tab-new" class="hidden">
  <button class="back-btn" onclick="showTab('dashboard')">← Retour</button>
  <h2>Nouvelle course</h2>
  
  <div id="voice-feedback" style="color:#a78bfa;font-size:13px;min-height:20px;margin:8px 0;text-align:center"></div>

  <!-- MODULE SCAN INTÉGRÉ ICI -->
  <div class="scan-zone" onclick="document.getElementById('file-input').click()">
    <h3>📷 1. Ajouter l'ordonnance (PMT)</h3>
    <p>Photo, galerie ou fichier. L'IA extrait le N° de Sécu.</p>
  </div>
  <!-- J'ai supprimé capture="environment" pour permettre de choisir Galerie ou Fichier -->
  <input type="file" id="file-input" accept="image/*, application/pdf" style="display:none" onchange="processDocument(event)">
  <div id="scan-preview" style="margin-bottom:16px;text-align:center;"></div>
  
  <label style="color:#94a3b8;font-size:13px;">Catégorie de doc :</label>
  <div class="cat-selector">
    <button class="cat-btn active" onclick="setCategory('CPAM', this)">📄 CPAM / Ord.</button>
    <button class="cat-btn" onclick="setCategory('Frais', this)">☕ Frais</button>
    <button class="cat-btn" onclick="setCategory('Voyage', this)">⛽ Péage/Essence</button>
  </div>

  <div class="input-group"><label>Nom & Prénom patient</label><input id="patient_nom" placeholder="DUPONT Jean"></div>
  <div class="input-group"><label>N° Sécurité Sociale (15 chiffres)</label><input id="patient_num_ss" placeholder="185037512345678" inputmode="numeric"></div>
  <div class="input-group"><label>Départ</label><input id="lieu_depart" placeholder="Lieu de prise en charge"></div>
  <div class="input-group"><label>Arrivée</label><input id="lieu_arrivee" placeholder="Destination"></div>
  <div class="input-group"><label>Kilométrage</label><input id="kilometrage" placeholder="42.5" type="number" step="0.1"></div>
  
  <div class="input-group">
    <label>Code transport</label>
    <div class="radio-group" id="code-group">
      <button type="button" data-code="T1" class="active" onclick="selectCode('T1')">T1</button>
      <button type="button" data-code="T2" onclick="selectCode('T2')">T2</button>
      <button type="button" data-code="T3" onclick="selectCode('T3')">T3</button>
      <button type="button" data-code="T4" onclick="selectCode('T4')">T4</button>
    </div>
  </div>

  <button class="btn" id="btn-verify" onclick="createCourse()">VALIDER & VÉRIFIER (MISTRAL)</button>
  <div id="course-error" class="error-box hidden"></div>
</div>

<!-- HISTORIQUE -->
<div id="tab-history" class="hidden">
  <h2>📋 Historique</h2>
  <div id="history-list"></div>
</div>

<!-- RÉSULTAT IA -->
<div id="tab-result" class="hidden">
  <button class="back-btn" onclick="showTab('new')">← Modifier</button>
  <div style="text-align:center;padding:10px 0;">
    <div style="font-size:42px" id="result-status">✅</div>
    <div style="font-size:20px;font-weight:700;margin:10px 0" id="result-message">Course enregistrée</div>
    <div style="font-size:32px;font-weight:800;color:#4ade80" id="result-amount">0 €</div>
    <div id="mistral-box" class="mistral-box hidden"></div>
    <button class="btn btn-secondary" onclick="showTab('dashboard')">RETOUR ACCUEIL</button>
  </div>
</div>

<script>
const API_URL = 'https://taxi-app-k6u3.onrender.com';
let selectedCode = 'T1', voiceActive = false, selectedCategory = 'CPAM';
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;

function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR'; u.rate = 1.05;
  window.speechSynthesis.speak(u);
}

// GESTION DU MICRO
function toggleVoiceMaster(){
  if(!SpeechRecognition){ alert("Synthèse vocale non supportée sur ce navigateur"); return; }
  voiceActive = !voiceActive;
  const btn = document.getElementById('mic-btn');
  if(voiceActive){
    btn.classList.add('active');
    speak("Copilote activé.");
    startListeningLoop();
  } else {
    btn.classList.remove('active');
    if(recognizer) recognizer.stop();
    speak("Micro désactivé.");
  }
}

function startListeningLoop(){
  if(!voiceActive) return;
  recognizer = new SpeechRecognition();
  recognizer.lang = 'fr-FR';
  recognizer.continuous = true;
  recognizer.interimResults = false;

  recognizer.onresult = function(e){
    const text = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
    document.getElementById('voice-feedback').textContent = '🎙️ "' + text + '"';
    parseVoiceCommand(text);
  };

  recognizer.onerror = function(){};
  recognizer.onend = function(){ if(voiceActive) setTimeout(startListeningLoop, 300); };
  try{ recognizer.start(); }catch(e){}
}

function parseVoiceCommand(t){
  // Ouverture Nouvelle Course
  if(t.includes("nouvelle course") || t.includes("ajouter course")){
    showTab('new');
    speak("Nouvelle course ouverte.");
    return;
  }
  
  // Validation vocale de la course
  if(t.includes("valider") || t.includes("enregistrer") || t.includes("confirmer la course")){
    if(!document.getElementById('tab-new').classList.contains('hidden')){
      createCourse();
      return;
    }
  }

  // Remplissage du formulaire avec des regex plus souples
  if(!document.getElementById('tab-new').classList.contains('hidden')){
    
    // Détecte : "il s'appelle Dupont Jean" ou "le nom est Dupont" ou "monsieur Dupont"
    let m = t.match(/(?:patient|nom|s'appelle|monsieur|madame|mr|mme)\s+([a-zéèàîï\-]+)(?:\s+([a-zéèàîï\-]+))?/i);
    if(m){ 
      let nom = m[1] || "";
      let prenom = m[2] || "";
      document.getElementById('patient_nom').value = (nom + " " + prenom).trim().toUpperCase(); 
    }
    
    // Détecte : "de Avignon à Orange" ou "départ Avignon arrivée Orange"
    m = t.match(/(?:de|départ)\s+(.+?)\s+(?:à|vers|pour|arrivée)\s+(.+)/i);
    if(m){ 
      document.getElementById('lieu_depart').value = m[1].trim(); 
      document.getElementById('lieu_arrivee').value = m[2].trim(); 
    }
    
    // Détecte : "42 km" ou "42.5 kilomètres"
    m = t.match(/(\d+[.,]?\d*)\s*(?:km|kilomètre)/i);
    if(m){ 
      document.getElementById('kilometrage').value = m[1].replace(',','.'); 
    }
    
    if(t.includes("t1")) selectCode('T1');
    if(t.includes("t2")) selectCode('T2');
    if(t.includes("t3")) selectCode('T3');
    if(t.includes("t4")) selectCode('T4');
  }
}

function showTab(tabId){
  document.querySelectorAll('[id^="tab-"]').forEach(el=>el.classList.add('hidden'));
  document.getElementById('tab-'+tabId).classList.remove('hidden');
  document.querySelectorAll('.nav-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tabId));
  if(tabId==='dashboard') loadDashboard();
}

function selectCode(code){
  selectedCode = code;
  document.querySelectorAll('#code-group button').forEach(b=>b.classList.toggle('active',b.dataset.code===code));
}

function setCategory(cat, btnElement){
  selectedCategory = cat;
  if(btnElement){
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btnElement.classList.add('active');
  }
}

// RETRAITEMENT D'IMAGE & OCR 100% LOCAL
async function processDocument(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('scan-preview');
  preview.innerHTML = "<p style='color:#38bdf8'>⏳ Analyse OCR locale en cours...</p>";

  const reader = new FileReader();
  reader.onload = function(event){
    const img = new Image();
    img.onload = async function(){
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      // Traitement visuel local (contraste)
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        let avg = (d[i] + d[i+1] + d[i+2]) / 3;
        avg = avg > 135 ? 255 : avg * 0.75;
        d[i] = avg; d[i+1] = avg; d[i+2] = avg;
      }
      ctx.putImageData(imgData, 0, 0);

      // Moteur OCR local Tesseract
      try {
        const worker = await Tesseract.createWorker('fra');
        const ret = await worker.recognize(canvas);
        await worker.terminate();
        
        // Extrait le N° de Sécurité Sociale
        const text = ret.data.text;
        const nirMatch = text.match(/[12]\s*[\d\s]{14,18}/);
        if(nirMatch){
          const cleanNir = nirMatch[0].replace(/\s+/g, '');
          if(cleanNir.length >= 13) {
            document.getElementById('patient_num_ss').value = cleanNir.substring(0, 15);
            speak("Numéro de sécurité sociale détecté.");
          }
        }
      } catch(err) {
        console.log("OCR local indisponible.");
      }

      const processedUrl = canvas.toDataURL('image/jpeg', 0.85);
      preview.innerHTML = `
        <img src="${processedUrl}" style="max-width:100%;border-radius:12px;border:2px solid #22c55e; max-height:200px;">
        <p style="color:#4ade80;margin-top:8px">✅ Document joint à la course</p>
      `;
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

// CRÉATION DE COURSE
async function createCourse(){
  const data = {
    patient_nom: document.getElementById('patient_nom').value.trim(),
    patient_num_ss: document.getElementById('patient_num_ss').value.trim(),
    lieu_depart: document.getElementById('lieu_depart').value.trim(),
    lieu_arrivee: document.getElementById('lieu_arrivee').value.trim(),
    kilometrage: parseFloat(document.getElementById('kilometrage').value) || 0,
    code_transport: selectedCode
  };

  if(!data.patient_nom || !data.lieu_depart || !data.lieu_arrivee){
    document.getElementById('course-error').textContent = "Remplissez les champs obligatoires.";
    document.getElementById('course-error').classList.remove('hidden');
    speak("Informations manquantes.");
    return;
  }

  try {
    const res = await fetch(API_URL + '/courses', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await res.json();
    document.getElementById('result-amount').textContent = (result.montant_total || 0) + ' €';
    if(result.mistral_advice){
      document.getElementById('mistral-box').textContent = result.mistral_advice;
      document.getElementById('mistral-box').classList.remove('hidden');
    }
    showTab('result');
    speak("Course validée.");
  } catch(e) {
    document.getElementById('course-error').textContent = "Erreur de connexion serveur.";
    document.getElementById('course-error').classList.remove('hidden');
  }
}

async function loadDashboard(){
  try {
    const res = await fetch(API_URL + '/courses');
    const list = await res.json();
    if(Array.isArray(list)){
      document.getElementById('stats-courses').textContent = list.length;
      const total = list.reduce((s,c)=>s+(parseFloat(c.montant_total)||0),0);
      document.getElementById('stats-ca').textContent = total.toFixed(0) + ' €';
      document.getElementById('stats-avg').textContent = list.length ? (total/list.length).toFixed(0) + ' €' : '0 €';
      document.getElementById('api-badge').textContent = '🟢 En ligne';
      document.getElementById('api-badge').style.color = '#4ade80';
    }
  } catch(e) {
    document.getElementById('api-badge').textContent = '⚪ Hors ligne';
  }
}

document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
</body>
</html>
